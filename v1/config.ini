; MathShips reads this file from its own folder on startup.
; Values are validated at launch; the laser toggle controls button visibility only.

[display]
screen_width = 1600
screen_height = 1200
side_margin = 150
canvas_top = 250
ship_tray_top = 10
ship_tray_ship_offset = 50
ship_control_font_size = 18
ship_tray_font_size = 28
control_wrap_length = 250
laser_cannon_size = 20

[ships]
cell_size = 40
lengths = 2, 2, 3, 4
gap = 20
move_point_radius = 7
rotate_widget_radius = 11
initial_angle_radians = 0
max_angle_radians = 1.57
initial_height = 0

[laser]
enabled = true
show_toggle = false
length = 3000
pulse_duration = 0.35
pulse_trail_length = 280
hit_marker_duration = 1

[controls]
angle_adjust_step = 0.01
height_adjust_step = 10
initial_repeat_delay_ms = 300
repeat_interval_ms = 50

[multiplayer]
game_code_characters = ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
discovery_port = 8002
discovery_timeout_seconds = 1
discovery_retry_seconds = 2
discovery_poll_interval_ms = 250
worker_retry_seconds = 1
worker_initial_wait_seconds = 5
worker_poll_interval_seconds = 0.1

[application]
startup_delay_ms = 100
idle_sleep_seconds = 0.01
